type: object
required:
  - usedWater
  - drinkingTime
  - userId
properties:
  _id:
    description: "Water's id"
    type: string
    example: 669b4b5ee4582ae60fc053a8
  usedWater:
    description: "Water's volume"
    type: number
    example: 60
  drinkType:
    description: 'Kind of drink'
    type: string
    enum: [water, tea, milk, coffee, juice, soda]
    example: coffee
  hydration:
    description: 'Ml counted toward the goal (usedWater times the share of the drink). Missing on entries from before drink types: count usedWater.'
    type: number
    example: 48
  userId:
    description: 'Id of the user who manages the water volume'
    type: string
    example: 669b4b40e4582ae60fc0539f
  drinkingTime:
    description: 'Time of creation of data on the volume of water consumed'
    type: string
    example: 20.07.2024 09:50
