tags:
  - Water
summary: Creates water volume data
operationId: createWater
description: 'Create water volum data with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - usedWater
        properties:
          usedWater:
            description: "Water's usedWater"
            type: number
            example: 80
          drinkType:
            description: 'Kind of drink; it sets the share counted toward the goal (water 100%, tea and milk 90%, coffee and juice 80%, soda 70%). Defaults to water.'
            type: string
            enum: [water, tea, milk, coffee, juice, soda]
            example: coffee
responses:
  '201':
    description: Creates water usedWater
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Water added successfully
            data:
              type: object
              $ref: '../../components/schemas/water.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
